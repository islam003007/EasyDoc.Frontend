name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EasyDoc.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EasyDoc.Web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:sizes
      - run: npm test
      - run: npm run build
